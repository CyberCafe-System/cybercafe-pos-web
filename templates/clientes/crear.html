<div class="modal fade" id="modalCrearCliente" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{% url 'crear_cliente' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Registrar Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold required-field">Nombre</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold required-field">Apellido</label>
                            <input type="text" name="apellido" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">DUI</label>
                        <input type="text" name="dui" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">Teléfono</label>
                        <input type="number" name="telefono" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">Dirección</label>
                        <input type="text" name="direccion" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
