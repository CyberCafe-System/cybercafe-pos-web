<!-- Modal Modificar Cliente -->
<div class="modal fade" id="modalModificarCliente" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{% url 'modificar_cliente' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Modificar Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="cliente_id" id="editarClienteId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold required-field">Nombre</label>
                            <input type="text" name="nombre" id="editarClienteNombre" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold required-field">Apellido</label>
                            <input type="text" name="apellido" id="editarClienteApellido" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">DUI</label>
                        <input type="text" name="dui" id="editarClienteDui" class="form-control" maxlength="10" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">Teléfono</label>
                        <input type="number" name="telefono" id="editarClienteTelefono" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">Dirección</label>
                        <input type="text" name="direccion" id="editarClienteDireccion" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo (Opcional)</label>
                        <input type="email" name="correo" id="editarClienteCorreo" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Actualizar</button>
                </div>
            </form>
        </div>
    </div>
</div>
