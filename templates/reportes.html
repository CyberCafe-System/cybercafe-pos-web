{% extends 'base.html' %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Generación de Reportes</h3>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body text-center py-5">
                <i class="bi bi-file-earmark-bar-graph text-primary mb-3" style="font-size: 3rem;"></i>
                <h5>Corte de Caja Diario</h5>
                <p class="text-muted">Incluye detalle de ingresos por rentas y cafetería del día en curso.</p>
                <form method="GET" action="#">
                    <!-- El action se conectara a la vista Django que genera el PDF -->
                    <button type="submit" class="btn btn-danger mt-3">
                        <i class="bi bi-file-earmark-pdf-fill"></i> Descargar PDF
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body text-center py-5">
                <i class="bi bi-box-seam text-success mb-3" style="font-size: 3rem;"></i>
                <h5>Reporte de Inventario</h5>
                <p class="text-muted">Lista completa de existencias, precios y productos bajos en stock.</p>
                <form method="GET" action="#">
                    <button type="submit" class="btn btn-danger mt-3">
                        <i class="bi bi-file-earmark-pdf-fill"></i> Descargar PDF
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
