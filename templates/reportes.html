{% extends 'base.html' %}
{% load static %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Historial de Ventas y Tickets</h3>
    <button class="btn btn-outline-dark">
        <i class="bi bi-printer"></i> Imprimir Reporte
    </button>
</div>

<!-- Filtros de búsqueda -->
<div class="card shadow-sm border-0 rounded-4 mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold">Fecha de Inicio</label>
                <input type="date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Fecha Fin</label>
                <input type="date" class="form-control">
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-coffee w-100"><i class="bi bi-search me-2"></i>Buscar Ventas</button>
            </div>
        </div>
    </div>
</div>

<div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>N° Ticket</th>
                        <th>Fecha y Hora</th>
                        <th>Atendido por</th>
                        <th>Cliente</th>
                        <th>Artículos / Concepto</th>
                        <th>Total</th>
                        <th class="text-end">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Fila de ejemplo -->
                    <tr>
                        <td class="fw-bold">#TK-1050</td>
                        <td>14 Oct 2026, 02:15 PM</td>
                        <td>Edwin Cruz</td>
                        <td>Cliente General</td>
                        <td>2x Doritos, 1x Coca-Cola</td>
                        <td class="fw-bold text-success">$2.50</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary" title="Ver Detalle Ticket"><i class="bi bi-eye"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
