{% load l10n %}
<!-- Modal Procesar Venta con Calculadora de Cambio Sencilla -->
<div class="modal fade" id="modalProcesarVenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
            <form method="POST" action="{% url 'procesar_venta' %}" target="_blank" id="formProcesarVenta">
                {% csrf_token %}
                <div class="modal-header bg-dark text-white rounded-top-4">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-cash-stack me-2 text-warning"></i>Procesar Cobro de Venta
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body p-4">
                    <!-- Cliente -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-person-fill text-coffee me-1"></i> Cliente <span class="text-danger fw-bold">*</span>
                        </label>
                        <select name="cliente_id" id="posSelectCliente" class="form-select form-select-lg rounded-3" required>
                            <option value="" selected disabled>Seleccione un cliente...</option>
                            {% for cliente in clientes %}
                            <option value="{{ cliente.cliente_id }}" data-correo="{{ cliente.correo|default:'' }}" data-nombre="{{ cliente.nombre }} {{ cliente.apellido }}">
                                {{ cliente.nombre }} {{ cliente.apellido }} {% if cliente.correo %}({{ cliente.correo }}){% else %}[Sin correo]{% endif %}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Cuadro Total a Cobrar -->
                    <div class="bg-light p-3 rounded-4 mb-3 border text-center">
                        <span class="text-muted small text-uppercase fw-bold d-block mb-1">Total a Pagar</span>
                        <div class="display-6 fw-bold text-success font-monospace" id="posTotalDisplay">${{ total|floatformat:2 }}</div>
                        <input type="hidden" id="posTotalAPagar" value="{{ total|unlocalize }}">
                    </div>

                    <!-- Calculadora Rápida de Cambio/Vuelto -->
                    <div class="card border rounded-4 p-3 bg-white mb-3 shadow-xs">
                        <label class="form-label fw-semibold small text-muted mb-1">
                            <i class="bi bi-calculator me-1"></i>Calculadora de Vuelto / Efectivo:
                        </label>
                        <div class="input-group mb-2">
                            <span class="input-group-text bg-light fw-bold">$</span>
                            <input type="number" step="0.01" id="inputPagaConVenta" class="form-control font-monospace fs-5 fw-bold" placeholder="0.00">
                        </div>
                        <div class="d-flex flex-wrap gap-1 mb-3">
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="exacto">Exacto</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="1">$1</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="2">$2</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="5">$5</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="10">$10</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="20">$20</button>
                        </div>
                        <div class="d-flex justify-content-between align-items-center p-2 rounded-3 bg-light border">
                            <span class="small fw-semibold text-muted">Cambio / Vuelto:</span>
                            <strong class="fs-5 font-monospace text-dark" id="cobroVueltoTextoVenta">$0.00</strong>
                        </div>
                    </div>

                    <!-- Checklist de Envío de Factura por Correo Electrónico -->
                    <div class="card border rounded-4 p-3 bg-white mb-3 shadow-xs">
                        <div class="form-check form-switch d-flex align-items-center gap-2 mb-0">
                            <input class="form-check-input mt-0 fs-5" type="checkbox" role="switch" name="enviar_correo" id="checkEnviarCorreoVenta" value="1" checked>
                            <label class="form-check-label fw-semibold text-dark mb-0" for="checkEnviarCorreoVenta" style="cursor: pointer;">
                                <i class="bi bi-envelope-at-fill text-primary me-1"></i> Enviar factura al correo electrónico del cliente
                            </label>
                        </div>
                        <div id="infoCorreoClienteContainer" class="small text-muted mt-2 ps-4">
                            <span id="textoCorreoDestino" class="text-secondary fst-italic">
                                <i class="bi bi-info-circle me-1"></i>Seleccione un cliente para verificar su correo.
                            </span>
                        </div>
                        <div class="mt-1 ps-4 text-muted" style="font-size: 0.75rem;">
                            <i class="bi bi-send-check text-success me-1"></i>Remitente: <strong class="text-dark">thecoffeelan@gmail.com</strong>
                        </div>
                    </div>

                    <p class="text-muted small mb-0 text-center">
                        <i class="bi bi-info-circle me-1"></i>Al completar se registrará la venta y se generará la factura en PDF.
                    </p>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" id="btnCompletarVenta" class="btn btn-success rounded-pill px-4 shadow">
                        <i class="bi bi-check2-circle me-1"></i> Confirmar Venta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
