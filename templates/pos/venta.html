<div class="modal fade" id="modalProcesarVenta" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{% url 'procesar_venta' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Venta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Seleccionar Cliente</label>
                        <select name="cliente_id" class="form-select" required>
                            <option value="" selected disabled>Seleccione un cliente...</option>
                            {% for cliente in clientes %}
                            <option value="{{ cliente.cliente_id }}">{{ cliente.nombre }} {{ cliente.apellido }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span>Total a pagar:</span>
                        <span class="text-success">${{ total|floatformat:2 }}</span>
                    </div>
                    <p class="text-muted small mb-0 mt-2">
                        Al completar se registrará la venta y se generará la factura en PDF.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success">Completar Transacción</button>
                </div>
            </form>
        </div>
    </div>
</div>
