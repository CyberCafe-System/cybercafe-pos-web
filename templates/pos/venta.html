{% load l10n %}
<!-- Modal Procesar Venta Simplificado con Buscador de Cliente -->
<div class="modal fade" id="modalProcesarVenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
            <form method="POST" action="{% url 'procesar_venta' %}" target="_blank" id="formProcesarVenta">
                {% csrf_token %}
                <div class="modal-header bg-dark text-white rounded-top-4 py-3">
                    <h6 class="modal-title fw-bold mb-0">
                        <i class="bi bi-receipt me-2 text-warning"></i>Cobrar Venta
                    </h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body p-3 p-md-4">
                    <!-- Buscador de Cliente -->
                    <div class="mb-3 position-relative" id="contenedorBuscarClientePos">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold small text-muted text-uppercase mb-0">
                                <i class="bi bi-person-fill text-coffee me-1"></i>Cliente <span class="text-danger">*</span>
                            </label>
                            <span class="badge bg-light text-muted border small" id="badgeClienteSeleccionado">Sin seleccionar</span>
                        </div>

                        <div class="input-group shadow-xs">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" id="inputBuscarClientePos" class="form-control border-start-0 ps-0" 
                                   placeholder="Buscar por nombre o correo..." autocomplete="off">
                            <button class="btn btn-outline-secondary border-start-0 d-none" type="button" id="btnLimpiarClientePos" title="Limpiar selección">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                        <!-- Select nativo (oculto pero funcional para POST y validación) -->
                        <select name="cliente_id" id="posSelectCliente" class="d-none" required>
                            <option value="" selected disabled>Seleccione un cliente...</option>
                            {% for cliente in clientes %}
                            <option value="{{ cliente.cliente_id }}" 
                                    data-correo="{{ cliente.correo|default:'' }}" 
                                    data-nombre="{{ cliente.nombre }} {{ cliente.apellido }}">
                                {{ cliente.nombre }} {{ cliente.apellido }}
                            </option>
                            {% endfor %}
                        </select>

                        <!-- Menú flotante de resultados -->
                        <div id="listaResultadosClientePos" class="list-group position-absolute w-100 shadow rounded-3 border mt-1 overflow-auto d-none" 
                             style="max-height: 190px; z-index: 1060; background: #ffffff;">
                            {% for cliente in clientes %}
                            <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 px-3 item-cliente-pos"
                                    data-id="{{ cliente.cliente_id }}"
                                    data-nombre="{{ cliente.nombre }} {{ cliente.apellido }}"
                                    data-correo="{{ cliente.correo|default:'' }}"
                                    data-search="{{ cliente.nombre|lower }} {{ cliente.apellido|lower }} {{ cliente.correo|default:''|lower }} {{ cliente.dui|default:'' }}">
                                <div>
                                    <strong class="d-block text-dark small">{{ cliente.nombre }} {{ cliente.apellido }}</strong>
                                    {% if cliente.correo %}
                                    <small class="text-muted"><i class="bi bi-envelope me-1"></i>{{ cliente.correo }}</small>
                                    {% else %}
                                    <small class="text-secondary fst-italic">Sin correo</small>
                                    {% endif %}
                                </div>
                                <i class="bi bi-chevron-right text-muted small"></i>
                            </button>
                            {% endfor %}
                            <div id="sinResultadosClientePos" class="p-3 text-center text-muted small d-none">
                                No se encontraron clientes.
                            </div>
                        </div>
                    </div>

                    <!-- Total y Cambio en 2 Columnas Compactas -->
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <div class="bg-light p-2 rounded-3 border text-center h-100 d-flex flex-column justify-content-center">
                                <span class="text-muted text-uppercase fw-semibold" style="font-size: 0.72rem;">Total a Pagar</span>
                                <div class="fs-4 fw-bold text-success font-monospace" id="posTotalDisplay">${{ total|floatformat:2 }}</div>
                                <input type="hidden" id="posTotalAPagar" value="{{ total|unlocalize }}">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-light p-2 rounded-3 border text-center h-100 d-flex flex-column justify-content-center">
                                <span class="text-muted text-uppercase fw-semibold" style="font-size: 0.72rem;">Cambio / Vuelto</span>
                                <strong class="fs-4 font-monospace text-dark" id="cobroVueltoTextoVenta">$0.00</strong>
                            </div>
                        </div>
                    </div>

                    <!-- Efectivo Recibido con Billetes Rápidos -->
                    <div class="mb-3">
                        <div class="input-group input-group-sm mb-2 shadow-xs">
                            <span class="input-group-text bg-white fw-bold text-muted">$</span>
                            <input type="number" step="0.01" id="inputPagaConVenta" class="form-control font-monospace fs-6 fw-bold" placeholder="Efectivo recibido (0.00)">
                        </div>
                        <div class="d-flex flex-wrap gap-1">
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="exacto">Exacto</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="1">$1</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="2">$2</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="5">$5</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="10">$10</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro-venta" data-monto="20">$20</button>
                        </div>
                    </div>

                    <!-- Checklist de Envío por Correo Simplificado -->
                    <div class="card border rounded-3 p-2 bg-light shadow-xs mb-1">
                        <div class="form-check form-switch d-flex align-items-center gap-2 mb-0">
                            <input class="form-check-input mt-0 fs-5" type="checkbox" role="switch" name="enviar_correo" id="checkEnviarCorreoVenta" value="1" checked>
                            <label class="form-check-label fw-semibold text-dark small mb-0" for="checkEnviarCorreoVenta" style="cursor: pointer;">
                                <i class="bi bi-envelope-at text-primary me-1"></i>Enviar factura por correo
                            </label>
                        </div>
                        <div id="infoCorreoClienteContainer" class="small mt-1 ps-4" style="font-size: 0.8rem;">
                            <span id="textoCorreoDestino" class="text-muted">Seleccione un cliente para enviar factura.</span>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-0 pt-0 px-3 px-md-4 pb-3 pb-md-4">
                    <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" id="btnCompletarVenta" class="btn btn-success rounded-pill px-4 shadow">
                        <i class="bi bi-check2-circle me-1"></i> Confirmar Venta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
