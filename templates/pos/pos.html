{% extends 'base.html' %}
{% load static %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Punto de Venta</h3>
    <button class="btn btn-danger"><i class="bi bi-file-earmark-pdf-fill"></i> Generar Último Ticket PDF</button>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
            <div class="col">
                <div class="card shadow-sm border-0 h-100 rounded-3 overflow-hidden">
                    <img src="{% static 'img/logo.png' %}" class="card-img-top" style="height: 130px; object-fit: cover;">
                    <div class="card-body text-center p-2 d-flex flex-column">
                        <small class="text-muted d-block mb-1">Bebidas</small>
                        <h6 class="card-title fw-bold mb-1">Soda Cola</h6>
                        <p class="text-success fw-bold mb-2">$1.50</p>
                        <form method="POST" action="{% url 'agregar_carrito' %}" class="mt-auto">
                            {% csrf_token %}
                            <input type="hidden" name="producto_id" value="1">
                            <button type="submit" class="btn btn-primary btn-sm w-100 rounded-pill">Añadir</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-4 mt-4 mt-lg-0">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-2 text-center">
                <h5 class="fw-bold mb-0">Resumen de Orden</h5>
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-between mb-4 fs-5 fw-bold">
                    <span>Total:</span>
                    <span class="text-success">$7.35</span>
                </div>
                <button class="btn btn-success w-100 py-3 rounded-3 fw-bold fs-5" data-bs-toggle="modal" data-bs-target="#modalProcesarVenta">Procesar Pago</button>
            </div>
        </div>
    </div>
</div>

{% include 'pos/venta.html' %}
{% endblock %}
