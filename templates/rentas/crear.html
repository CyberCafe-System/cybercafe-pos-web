<!-- Modal Nueva Renta -->
<div class="modal fade" id="modalNuevaRenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <form method="POST" action="{% url 'crear_renta' %}">
                {% csrf_token %}
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-play-circle me-2 text-coffee"></i>Iniciar Renta de Equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-4">
                    <!-- Banner de Asignación Directa -->
                    <div class="alert alert-info py-2 px-3 rounded-3 d-none mb-3 align-items-center justify-content-between" id="alertaEquipoDirecto">
                        <div>
                            <span class="small text-muted d-block">Asignación directa:</span>
                            <strong class="text-dark" id="alertaEquipoDirectoNombre">--</strong>
                        </div>
                        <span class="badge bg-primary rounded-pill">Selección rápida</span>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted text-uppercase mb-1">
                            Equipo <span class="text-danger">*</span>
                        </label>
                        <select name="equipo_id" id="selectEquipoRenta" class="form-select rounded-3" required>
                            <option value="" data-tarifa="0">Seleccione un equipo disponible</option>
                            {% for eq in equipos_rentables %}
                            <option value="{{ eq.equipo_id }}" data-tarifa="{{ eq.tarifa_por_hora }}">{{ eq.nombre }} ({{ eq.tipo }} - ${{ eq.tarifa_por_hora }}/hr)</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Buscador de Cliente en Nueva Renta -->
                    <div class="mb-3 position-relative" id="contenedorBuscarClienteCrearRenta">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold small text-muted text-uppercase mb-0">
                                Cliente <span class="text-danger">*</span>
                            </label>
                            <span class="badge bg-light text-muted border small" id="badgeClienteCrearRenta">Sin seleccionar</span>
                        </div>

                        <div class="input-group shadow-xs">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" id="inputBuscarClienteCrearRenta" class="form-control border-start-0 ps-0" 
                                   placeholder="Buscar cliente por nombre o DUI..." autocomplete="off">
                            <button class="btn btn-outline-secondary border-start-0 d-none" type="button" id="btnLimpiarClienteCrearRenta" title="Limpiar selección">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                        <select name="cliente_id" id="selectClienteRenta" class="d-none" required>
                            <option value="" selected disabled>Seleccione el cliente</option>
                            {% for cl in clientes %}
                            <option value="{{ cl.cliente_id }}" 
                                    data-nombre="{{ cl.nombre }} {{ cl.apellido }}"
                                    data-correo="{{ cl.correo|default:'' }}">
                                {{ cl.nombre }} {{ cl.apellido }} (DUI: {{ cl.dui }})
                            </option>
                            {% endfor %}
                        </select>

                        <!-- Menú de resultados de cliente -->
                        <div id="listaResultadosClienteCrearRenta" class="list-group position-absolute w-100 shadow rounded-3 border mt-1 overflow-auto d-none" 
                             style="max-height: 180px; z-index: 1060; background: #ffffff;">
                            {% for cl in clientes %}
                            <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 px-3 item-cliente-crear-renta"
                                    data-id="{{ cl.cliente_id }}"
                                    data-nombre="{{ cl.nombre }} {{ cl.apellido }}"
                                    data-correo="{{ cl.correo|default:'' }}"
                                    data-search="{{ cl.nombre|lower }} {{ cl.apellido|lower }} {{ cl.dui|default:'' }} {{ cl.correo|default:''|lower }}">
                                <div>
                                    <strong class="d-block text-dark small">{{ cl.nombre }} {{ cl.apellido }}</strong>
                                    <small class="text-muted">DUI: {{ cl.dui|default:"N/A" }} {% if cl.correo %}· {{ cl.correo }}{% endif %}</small>
                                </div>
                                <i class="bi bi-chevron-right text-muted small"></i>
                            </button>
                            {% endfor %}
                            <div id="sinResultadosClienteCrearRenta" class="p-3 text-center text-muted small d-none">
                                No se encontraron clientes.
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tiempo de Renta (Minutos) <span class="text-danger fw-bold">*</span></label>
                        <input type="number" name="tiempo_de_renta" id="inputTiempoRenta" class="form-control rounded-3" min="15" step="15" value="60" required>
                        <div class="d-flex gap-2 mt-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill btn-quick-time" data-min="30">30 min</button>
                            <button type="button" class="btn btn-sm btn-coffee rounded-pill btn-quick-time active" data-min="60">1 hora</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill btn-quick-time" data-min="120">2 horas</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill btn-quick-time" data-min="180">3 horas</button>
                        </div>
                    </div>

                    <!-- Estimado en vivo -->
                    <div class="d-flex justify-content-between align-items-center p-3 rounded-3 bg-light border">
                        <span class="small text-muted fw-semibold">Total Estimado de la Sesión:</span>
                        <strong class="fs-4 text-success font-monospace" id="estimadoTotalRenta">$0.00</strong>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-coffee rounded-pill px-4 shadow-sm">
                        <i class="bi bi-play-fill me-1"></i> Iniciar Renta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function recalcularEstimadoRenta() {
        const selectEq = document.getElementById('selectEquipoRenta');
        const inputMin = document.getElementById('inputTiempoRenta');
        const display = document.getElementById('estimadoTotalRenta');
        if (!selectEq || !inputMin || !display) return;

        const opt = selectEq.options[selectEq.selectedIndex];
        const tarifa = parseFloat(opt ? opt.dataset.tarifa : 0) || 0;
        const minutos = parseInt(inputMin.value) || 0;
        const total = (tarifa * (minutos / 60)).toFixed(2);
        display.textContent = `$${total}`;
    }

    document.querySelectorAll('.btn-quick-time').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.btn-quick-time').forEach(b => {
                b.classList.remove('btn-coffee', 'active');
                b.classList.add('btn-outline-secondary');
            });
            this.classList.remove('btn-outline-secondary');
            this.classList.add('btn-coffee', 'active');
            document.getElementById('inputTiempoRenta').value = this.dataset.min;
            recalcularEstimadoRenta();
        });
    });

    const inputTiempo = document.getElementById('inputTiempoRenta');
    if (inputTiempo) inputTiempo.addEventListener('input', recalcularEstimadoRenta);

    const selectEq = document.getElementById('selectEquipoRenta');
    if (selectEq) selectEq.addEventListener('change', recalcularEstimadoRenta);

    // Buscador interactivo de clientes en Nueva Renta
    const inputBuscarClienteCrearRenta = document.getElementById('inputBuscarClienteCrearRenta');
    const listaResultadosClienteCrearRenta = document.getElementById('listaResultadosClienteCrearRenta');
    const btnLimpiarClienteCrearRenta = document.getElementById('btnLimpiarClienteCrearRenta');
    const selectClienteRenta = document.getElementById('selectClienteRenta');
    const badgeClienteCrearRenta = document.getElementById('badgeClienteCrearRenta');
    const sinResultadosClienteCrearRenta = document.getElementById('sinResultadosClienteCrearRenta');
    const itemsClienteCrearRenta = document.querySelectorAll('.item-cliente-crear-renta');

    function filtrarClientesCrearRenta(termino) {
        termino = (termino || '').toLowerCase().trim();
        let visibles = 0;
        itemsClienteCrearRenta.forEach(function (item) {
            const searchStr = item.dataset.search || '';
            if (!termino || searchStr.includes(termino)) {
                item.classList.remove('d-none');
                visibles++;
            } else {
                item.classList.add('d-none');
            }
        });
        if (sinResultadosClienteCrearRenta) {
            if (visibles === 0) {
                sinResultadosClienteCrearRenta.classList.remove('d-none');
            } else {
                sinResultadosClienteCrearRenta.classList.add('d-none');
            }
        }
    }

    if (inputBuscarClienteCrearRenta && listaResultadosClienteCrearRenta) {
        inputBuscarClienteCrearRenta.addEventListener('focus', function () {
            filtrarClientesCrearRenta(this.value);
            listaResultadosClienteCrearRenta.classList.remove('d-none');
        });

        inputBuscarClienteCrearRenta.addEventListener('input', function () {
            filtrarClientesCrearRenta(this.value);
            listaResultadosClienteCrearRenta.classList.remove('d-none');
        });

        document.addEventListener('click', function (e) {
            const cont = document.getElementById('contenedorBuscarClienteCrearRenta');
            if (cont && !cont.contains(e.target)) {
                listaResultadosClienteCrearRenta.classList.add('d-none');
            }
        });
    }

    itemsClienteCrearRenta.forEach(function (item) {
        item.addEventListener('click', function () {
            const clienteId = this.dataset.id;
            const clienteNombre = this.dataset.nombre;

            if (selectClienteRenta) {
                selectClienteRenta.value = clienteId;
                selectClienteRenta.dispatchEvent(new Event('change'));
            }
            if (inputBuscarClienteCrearRenta) {
                inputBuscarClienteCrearRenta.value = clienteNombre;
            }
            if (badgeClienteCrearRenta) {
                badgeClienteCrearRenta.textContent = '✓ Seleccionado';
                badgeClienteCrearRenta.className = 'badge bg-success-subtle text-success border border-success-subtle small';
            }
            if (btnLimpiarClienteCrearRenta) {
                btnLimpiarClienteCrearRenta.classList.remove('d-none');
            }
            if (listaResultadosClienteCrearRenta) {
                listaResultadosClienteCrearRenta.classList.add('d-none');
            }
        });
    });

    if (btnLimpiarClienteCrearRenta) {
        btnLimpiarClienteCrearRenta.addEventListener('click', function () {
            if (inputBuscarClienteCrearRenta) {
                inputBuscarClienteCrearRenta.value = '';
                inputBuscarClienteCrearRenta.focus();
            }
            if (selectClienteRenta) {
                selectClienteRenta.value = '';
                selectClienteRenta.dispatchEvent(new Event('change'));
            }
            if (badgeClienteCrearRenta) {
                badgeClienteCrearRenta.textContent = 'Sin seleccionar';
                badgeClienteCrearRenta.className = 'badge bg-light text-muted border small';
            }
            this.classList.add('d-none');
            filtrarClientesCrearRenta('');
            if (listaResultadosClienteCrearRenta) {
                listaResultadosClienteCrearRenta.classList.remove('d-none');
            }
        });
    }
</script>
