<!-- Modal Nueva Renta -->
<div class="modal fade" id="modalNuevaRenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <form method="POST" action="{% url 'crear_renta' %}">
                {% csrf_token %}
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-play-circle me-2 text-coffee"></i>Iniciar Renta de Equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-4">
                    <p class="text-muted small mb-3">Los campos marcados con <span class="text-danger fw-bold">*</span> son obligatorios.</p>

                    <!-- Banner de Asignación Directa -->
                    <div class="alert alert-info py-2 px-3 rounded-3 d-none mb-3 align-items-center justify-content-between" id="alertaEquipoDirecto">
                        <div>
                            <span class="small text-muted d-block">Asignación directa:</span>
                            <strong class="text-dark" id="alertaEquipoDirectoNombre">--</strong>
                        </div>
                        <span class="badge bg-primary rounded-pill">Selección rápida</span>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Seleccionar Equipo <span class="text-danger fw-bold">*</span></label>
                        <select name="equipo_id" id="selectEquipoRenta" class="form-select rounded-3" required>
                            <option value="" data-tarifa="0">Seleccione un equipo disponible</option>
                            {% for eq in equipos_rentables %}
                            <option value="{{ eq.equipo_id }}" data-tarifa="{{ eq.tarifa_por_hora }}">{{ eq.nombre }} ({{ eq.tipo }} - ${{ eq.tarifa_por_hora }}/hr)</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Seleccionar Cliente <span class="text-danger fw-bold">*</span></label>
                        <select name="cliente_id" id="selectClienteRenta" class="form-select rounded-3" required>
                            <option value="">Seleccione el cliente</option>
                            {% for cl in clientes %}
                            <option value="{{ cl.cliente_id }}">{{ cl.nombre }} {{ cl.apellido }} (DUI: {{ cl.dui }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tiempo de Renta (Minutos) <span class="text-danger fw-bold">*</span></label>
                        <input type="number" name="tiempo_de_renta" id="inputTiempoRenta" class="form-control rounded-3" min="15" step="15" value="60" required>
                        <div class="d-flex gap-2 mt-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill btn-quick-time" data-min="30">30 min</button>
                            <button type="button" class="btn btn-sm btn-coffee rounded-pill btn-quick-time active" data-min="60">1 hora</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill btn-quick-time" data-min="120">2 horas</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill btn-quick-time" data-min="180">3 horas</button>
                        </div>
                    </div>

                    <!-- Estimado en vivo -->
                    <div class="d-flex justify-content-between align-items-center p-3 rounded-3 bg-light border">
                        <span class="small text-muted fw-semibold">Total Estimado de la Sesión:</span>
                        <strong class="fs-4 text-success font-monospace" id="estimadoTotalRenta">$0.00</strong>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-coffee rounded-pill px-4 shadow-sm">
                        <i class="bi bi-play-fill me-1"></i> Iniciar Renta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function recalcularEstimadoRenta() {
        const selectEq = document.getElementById('selectEquipoRenta');
        const inputMin = document.getElementById('inputTiempoRenta');
        const display = document.getElementById('estimadoTotalRenta');
        if (!selectEq || !inputMin || !display) return;

        const opt = selectEq.options[selectEq.selectedIndex];
        const tarifa = parseFloat(opt ? opt.dataset.tarifa : 0) || 0;
        const minutos = parseInt(inputMin.value) || 0;
        const total = (tarifa * (minutos / 60)).toFixed(2);
        display.textContent = `$${total}`;
    }

    document.querySelectorAll('.btn-quick-time').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.btn-quick-time').forEach(b => {
                b.classList.remove('btn-coffee', 'active');
                b.classList.add('btn-outline-secondary');
            });
            this.classList.remove('btn-outline-secondary');
            this.classList.add('btn-coffee', 'active');
            document.getElementById('inputTiempoRenta').value = this.dataset.min;
            recalcularEstimadoRenta();
        });
    });

    const inputTiempo = document.getElementById('inputTiempoRenta');
    if (inputTiempo) inputTiempo.addEventListener('input', recalcularEstimadoRenta);

    const selectEq = document.getElementById('selectEquipoRenta');
    if (selectEq) selectEq.addEventListener('change', recalcularEstimadoRenta);
</script>
