<!-- Modal de Cobro de Renta Simplificado con Buscador de Cliente -->
<div class="modal fade" id="modalCobroRenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
            <form method="POST" action="{% url 'finalizar_renta' %}" target="_blank" id="formCobroRenta">
                {% csrf_token %}
                <input type="hidden" name="detalle_renta_id" id="cobroDetalleId">

                <div class="modal-header bg-dark text-white rounded-top-4 py-3">
                    <h6 class="modal-title fw-bold mb-0">
                        <i class="bi bi-receipt me-2 text-warning"></i>Cobrar Renta
                    </h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body p-3 p-md-4">
                    <!-- Resumen del Equipo y Tiempo -->
                    <div class="bg-light p-2 px-3 rounded-3 mb-3 border d-flex justify-content-between align-items-center">
                        <div>
                            <span class="text-muted small text-uppercase fw-semibold d-block" style="font-size: 0.72rem;">Equipo</span>
                            <strong class="text-dark fs-6" id="cobroEquipoNombre">--</strong>
                        </div>
                        <span class="badge bg-warning text-dark px-3 py-1 rounded-pill small">
                            <i class="bi bi-clock me-1"></i><span id="cobroTiempoTotal">--</span>
                        </span>
                    </div>

                    <!-- Buscador / Selector de Cliente -->
                    <div class="mb-3 position-relative" id="contenedorBuscarClienteRenta">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold small text-muted text-uppercase mb-0">
                                <i class="bi bi-person-fill text-coffee me-1"></i>Cliente Asignado
                            </label>
                            <span class="badge bg-light text-muted border small" id="badgeClienteCobroRenta">Asignado</span>
                        </div>

                        <div class="input-group shadow-xs">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" id="inputBuscarClienteRenta" class="form-control border-start-0 ps-0" 
                                   placeholder="Buscar cliente para cambiar..." autocomplete="off">
                            <button class="btn btn-outline-secondary border-start-0 d-none" type="button" id="btnLimpiarClienteRenta" title="Limpiar selección">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                        <!-- Select oculto para envío POST -->
                        <select name="cliente_id" id="selectClienteCobroRenta" class="d-none">
                            <option value="">Mantener cliente actual</option>
                            {% for cl in clientes %}
                            <option value="{{ cl.cliente_id }}" 
                                    data-correo="{{ cl.correo|default:'' }}" 
                                    data-nombre="{{ cl.nombre }} {{ cl.apellido }}">
                                {{ cl.nombre }} {{ cl.apellido }}
                            </option>
                            {% endfor %}
                        </select>

                        <!-- Menú flotante de resultados -->
                        <div id="listaResultadosClienteRenta" class="list-group position-absolute w-100 shadow rounded-3 border mt-1 overflow-auto d-none" 
                             style="max-height: 180px; z-index: 1060; background: #ffffff;">
                            {% for cl in clientes %}
                            <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 px-3 item-cliente-renta"
                                    data-id="{{ cl.cliente_id }}"
                                    data-nombre="{{ cl.nombre }} {{ cl.apellido }}"
                                    data-correo="{{ cl.correo|default:'' }}"
                                    data-search="{{ cl.nombre|lower }} {{ cl.apellido|lower }} {{ cl.correo|default:''|lower }} {{ cl.dui|default:'' }}">
                                <div>
                                    <strong class="d-block text-dark small">{{ cl.nombre }} {{ cl.apellido }}</strong>
                                    {% if cl.correo %}
                                    <small class="text-muted"><i class="bi bi-envelope me-1"></i>{{ cl.correo }}</small>
                                    {% else %}
                                    <small class="text-secondary fst-italic">Sin correo</small>
                                    {% endif %}
                                </div>
                                <i class="bi bi-chevron-right text-muted small"></i>
                            </button>
                            {% endfor %}
                            <div id="sinResultadosClienteRenta" class="p-3 text-center text-muted small d-none">
                                No se encontraron clientes.
                            </div>
                        </div>
                    </div>

                    <!-- Total y Cambio en 2 Columnas -->
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <div class="bg-light p-2 rounded-3 border text-center h-100 d-flex flex-column justify-content-center">
                                <span class="text-muted text-uppercase fw-semibold" style="font-size: 0.72rem;">Total a Cobrar</span>
                                <div class="fs-4 fw-bold text-success font-monospace" id="cobroTotalTexto">$0.00</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-light p-2 rounded-3 border text-center h-100 d-flex flex-column justify-content-center">
                                <span class="text-muted text-uppercase fw-semibold" style="font-size: 0.72rem;">Cambio / Vuelto</span>
                                <strong class="fs-4 font-monospace text-dark" id="cobroVueltoTexto">$0.00</strong>
                            </div>
                        </div>
                    </div>

                    <!-- Efectivo Recibido con Billetes Rápidos -->
                    <div class="mb-3">
                        <div class="input-group input-group-sm mb-2 shadow-xs">
                            <span class="input-group-text bg-white fw-bold text-muted">$</span>
                            <input type="number" step="0.01" min="0" max="99999.99" id="inputPagaConRenta" class="form-control font-monospace fs-6 fw-bold" placeholder="Efectivo recibido (0.00)" inputmode="decimal">
                        </div>
                        <div class="d-flex flex-wrap gap-1">
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro" data-monto="exacto">Exacto</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro" data-monto="1">$1</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro" data-monto="2">$2</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro" data-monto="5">$5</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro" data-monto="10">$10</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2 btn-billete-cobro" data-monto="20">$20</button>
                        </div>
                    </div>

                    <!-- Checklist de Envío por Correo Simplificado -->
                    <div class="card border rounded-3 p-3 bg-light shadow-xs mb-1">
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <div class="form-check form-switch m-0 p-0 d-flex align-items-center">
                                <input class="form-check-input m-0 fs-5" type="checkbox" role="switch" name="enviar_correo" id="checkEnviarCorreoRenta" value="1" checked style="cursor: pointer;">
                            </div>
                            <label class="form-check-label fw-semibold text-dark small mb-0" for="checkEnviarCorreoRenta" style="cursor: pointer;">
                                <i class="bi bi-envelope-at text-primary me-1"></i>Enviar comprobante por correo
                            </label>
                        </div>
                        <div id="infoCorreoClienteRentaContainer" class="small ps-1" style="font-size: 0.8rem;">
                            <span id="textoCorreoDestinoRenta" class="text-muted"></span>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-0 pt-0 px-3 px-md-4 pb-3 pb-md-4">
                    <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" id="btnConfirmarCobroRenta" class="btn btn-success rounded-pill px-4 shadow">
                        <i class="bi bi-check2-circle me-1"></i> Confirmar y Cobrar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
