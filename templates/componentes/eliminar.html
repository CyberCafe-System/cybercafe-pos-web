<!-- Modal Eliminar Componente -->
<div class="modal fade" id="modalEliminarComponente" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{% url 'eliminar_componente' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title text-danger">Eliminar Componente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="componente_id" value="{{ componente.componente_id }}">
                    <p>¿Desea dar de baja este componente del sistema?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
