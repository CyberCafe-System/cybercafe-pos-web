{% extends 'base.html' %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Panel de Operaciones</h3>
    <!-- Boton para generar reporte en PDF -->
    <button class="btn btn-danger shadow-sm">
        <i class="bi bi-file-earmark-pdf-fill"></i> Generar Reporte PDF 
    </button>
</div>

<!-- Estadisticas de Equipos -->
<h5 class="text-muted mb-3">Estado de los Equipos</h5>
<div class="row g-4 mb-5">
    <div class="col-md-3">
        <div class="card shadow-sm border-0 border-start border-success border-5 h-100">
            <div class="card-body">
                <h6 class="text-muted">Equipos Disponibles</h6>
                <h2 class="mb-0 text-success fw-bold">8</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card shadow-sm border-0 border-start border-warning border-5 h-100">
            <div class="card-body">
                <h6 class="text-muted">Equipos en Uso</h6>
                <h2 class="mb-0 text-warning fw-bold">3</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card shadow-sm border-0 border-start border-info border-5 h-100">
            <div class="card-body">
                <h6 class="text-muted">Pendientes de Revision</h6>
                <h2 class="mb-0 text-info fw-bold">1</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card shadow-sm border-0 border-start border-danger border-5 h-100">
            <div class="card-body">
                <h6 class="text-muted">En Mantenimiento</h6>
                <h2 class="mb-0 text-danger fw-bold">2</h2>
            </div>
        </div>
    </div>
</div>

<!-- Estadisticas Financieras y Operativas -->
<h5 class="text-muted mb-3">Resumen del Dia</h5>
<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 h-100" style="background-color: var(--clr-espresso); color: var(--clr-crema);">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="opacity-75">Ingresos Cafeteria (POS)</h6>
                    <h2 class="mb-0 fw-bold text-white">$ 45.50</h2>
                </div>
                <i class="bi bi-cup-hot fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm border-0 h-100" style="background-color: var(--clr-cobre); color: white;">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="opacity-75">Ingresos por Rentas</h6>
                    <h2 class="mb-0 fw-bold text-white">$ 24.00</h2>
                </div>
                <i class="bi bi-pc-display fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
</div>
{% endblock %}
