{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - COFFEE LAN</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=4">
</head>
<body class="login-bg">

    <div class="login-wrapper">
        <div class="glass-panel">
            
            <div class="text-center mb-3">
                <img src="{% static 'img/logo.png' %}" alt="Logo Coffee LAN" class="glass-logo">
            </div>
            <div class="glass-title text-center">
                <span class="text-dark fw-normal">The</span> 
                <span class="fw-black text-dark">COFFEE</span> 
                <span class="fw-black text-warning-custom">LAN</span>
            </div>
            <h5 class="text-center fw-bold text-dark mb-4">Inicia Sesión</h5>
            
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="glass-label">
                        <div class="icon-circle-glass"><i class="bi bi-person-fill"></i></div> 
                        Nombre de Usuario
                    </label>
                    <input type="text" name="username" class="form-control glass-input" required>
                </div>

                <div class="mb-4">
                    <label class="glass-label">
                        <div class="icon-circle-glass"><i class="bi bi-lock-fill"></i></div> 
                        Contraseña
                    </label>
                    <input type="password" name="password" class="form-control glass-input" placeholder="••••••••••••" required>
                </div>
                
                <div class="text-center mt-5">
                    <button type="submit" class="btn glass-btn">Iniciar Sesión</button>
                </div>
            </form>
            
            <div class="text-center mt-4 glass-footer">
                Si olvidaste tu contraseña.<br>
                <a href="#" class="glass-link">Notifica al Administrador</a>
            </div>

        </div>
    </div>

</body>
</html>
