<!-- Modal Editar Categoría -->
<div class="modal fade" id="modalEditarCategoria" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <form method="POST" action="{% url 'modificar_categoria' %}">
                {% csrf_token %}
                <input type="hidden" name="categoria_id" id="editarCategoriaId" value="">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2 text-primary"></i>Editar Categoría</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-4">
                    <p class="text-muted small mb-3">Los campos marcados con <span class="text-danger fw-bold">*</span> son obligatorios.</p>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de la Categoría <span class="text-danger fw-bold">*</span></label>
                        <input type="text" name="nombre" id="editarCategoriaNombre" class="form-control rounded-3" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea name="descripcion" id="editarCategoriaDescripcion" class="form-control rounded-3" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Actualizar Categoría</button>
                </div>
            </form>
        </div>
    </div>
</div>
