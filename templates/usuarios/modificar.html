<!-- Modal Modificar Usuario -->
<div class="modal fade" id="modalModificarUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <form method="POST" action="{% url 'modificar_usuario' %}">
                {% csrf_token %}
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2 text-primary"></i>Modificar
                        Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-4">
                    <p class="text-muted small mb-3">Los campos marcados con <span class="text-danger fw-bold">*</span>
                        son obligatorios.</p>
                    <input type="hidden" name="usuario_id" id="editarUsuarioId">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Rol del Sistema <span
                                class="text-danger fw-bold">*</span></label>
                        <select name="rol" id="editarUsuarioRol" class="form-select rounded-3" required>
                            <option value="">Seleccione un rol</option>
                            {% for rol in roles %}
                            <option value="{{ rol.rol_id }}">{{ rol.nombre }}{% if rol.nombre|lower == 'asistente' %}
                                (Solo App Móvil){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre Completo <span
                                class="text-danger fw-bold">*</span></label>
                        <input type="text" name="nombre" id="editarUsuarioNombre" class="form-control rounded-3"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de Usuario (Username) <span
                                class="text-danger fw-bold">*</span></label>
                        <input type="text" name="username" id="editarUsuarioUsername" class="form-control rounded-3"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo Electrónico <span
                                class="text-danger fw-bold">*</span></label>
                        <input type="email" name="correo" id="editarUsuarioCorreo" class="form-control rounded-3"
                            required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-semibold">Nueva Contraseña</label>
                        <input type="password" name="nueva_password" id="editarUsuarioPassword"
                            class="form-control rounded-3" placeholder="Dejar en blanco para conservar la actual"
                            minlength="8" pattern=".{0}|(?=.*[A-Za-z])(?=.*\d).{8,}"
                            title="Si se especifica, debe tener al menos 8 caracteres y combinar letras y números.">
                        <div class="form-text small text-muted mt-1">
                            <i class="bi bi-shield-check me-1 text-primary"></i>Si se modifica: mínimo 8 caracteres
                            combinando letras y números.
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4"
                        data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Actualizar
                        Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>
