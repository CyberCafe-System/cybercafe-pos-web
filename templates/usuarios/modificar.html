<!-- Modal Modificar Usuario -->
<div class="modal fade" id="modalModificarUsuario" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{% url 'modificar_usuario' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Modificar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="usuario_id" id="editarUsuarioId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">Rol</label>
                        <select name="rol" id="editarUsuarioRol" class="form-select" required>
                            <option value="">Seleccione un rol</option>
                            {% for rol in roles %}
                            <option value="{{ rol.rol_id }}">{{ rol.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">Nombre Completo</label>
                        <input type="text" name="nombre" id="editarUsuarioNombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">Nombre de Usuario (Username)</label>
                        <input type="text" name="username" id="editarUsuarioUsername" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold required-field">Correo</label>
                        <input type="email" name="correo" id="editarUsuarioCorreo" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Actualizar</button>
                </div>
            </form>
        </div>
    </div>
</div>
