<!-- Modal Crear Usuario -->
<div class="modal fade" id="modalCrearUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <form method="POST" action="{% url 'crear_usuario' %}">
                {% csrf_token %}
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-person-plus me-2 text-coffee"></i>Crear Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-4">
                    <p class="text-muted small mb-3">Los campos marcados con <span class="text-danger fw-bold">*</span> son obligatorios.</p>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Rol del Sistema <span class="text-danger fw-bold">*</span></label>
                        <select name="rol" class="form-select rounded-3" required>
                            <option value="">Seleccione un rol</option>
                            {% for rol in roles %}
                            {% if rol.es_asistente %}
                            <option value="{{ rol.rol_id }}">{{ rol.nombre }} (Solo App Móvil)</option>
                            {% else %}
                            <option value="{{ rol.rol_id }}">{{ rol.nombre }}</option>
                            {% endif %}
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre Completo <span class="text-danger fw-bold">*</span></label>
                        <input type="text" name="nombre" class="form-control rounded-3" placeholder="Ej. Roberto Morales" maxlength="50" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de Usuario (Username) <span class="text-danger fw-bold">*</span></label>
                        <input type="text" name="username" class="form-control rounded-3" placeholder="Ej. rmorales" maxlength="50" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo Electrónico <span class="text-danger fw-bold">*</span></label>
                        <input type="email" name="correo" class="form-control rounded-3" placeholder="usuario@cybercafe.com" maxlength="75" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-semibold">Contraseña Inicial <span class="text-danger fw-bold">*</span></label>
                        <div class="input-group">
                            <input type="password" name="password" id="crearUsuarioPassword" class="form-control rounded-start-3" placeholder="********" minlength="8" maxlength="15" pattern="(?=.*[A-Z])(?=.*\d).{8,15}" title="Contraseña de 8 a 15 caracteres con al menos una mayúscula y un número." required>
                            <button class="btn btn-outline-secondary rounded-end-3 btn-toggle-password" type="button" data-target="crearUsuarioPassword" title="Mostrar u ocultar contraseña">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="form-text small text-muted mt-1">
                            <i class="bi bi-shield-check me-1 text-success"></i>Contraseña de 8 a 15 caracteres con al menos una mayúscula y un número.
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-coffee rounded-pill px-4 shadow-sm">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>
