<!-- Modal Modificar Producto -->
<div class="modal fade" id="modalModificarProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <form method="POST" action="{% url 'modificar_producto' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2 text-primary"></i>Modificar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-4">
                    <p class="text-muted small mb-3">Los campos marcados con <span class="text-danger fw-bold">*</span> son obligatorios.</p>
                    <input type="hidden" name="producto_id" id="editarProductoId">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Producto <span class="text-danger fw-bold">*</span></label>
                        <input type="text" name="nombre" id="editarProductoNombre" class="form-control rounded-3" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Categoría <span class="text-danger fw-bold">*</span></label>
                        <select name="categoria" id="editarProductoCategoria" class="form-select rounded-3" required>
                            <option value="">Seleccione una categoría</option>
                            {% for categoria in categorias %}
                            <option value="{{ categoria.categoria_id }}">{{ categoria.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row g-2">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Precio Compra ($) <span class="text-danger fw-bold">*</span></label>
                            <input type="number" step="0.01" name="precio_compra" id="editarProductoPrecioCompra" class="form-control rounded-3" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Precio Venta ($) <span class="text-danger fw-bold">*</span></label>
                            <input type="number" step="0.01" name="precio_venta" id="editarProductoPrecioVenta" class="form-control rounded-3" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Cantidad (Stock) <span class="text-danger fw-bold">*</span></label>
                        <input type="number" name="cantidad" id="editarProductoCantidad" class="form-control rounded-3" min="0" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-semibold">Cambiar Imagen</label>
                        <input type="file" name="imagen_upload" class="form-control rounded-3" accept="image/*">
                        <small class="text-muted">Deje vacío este campo si desea conservar la imagen actual.</small>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Actualizar Producto</button>
                </div>
            </form>
        </div>
    </div>
</div>
