<!-- Modal Crear Producto -->
<div class="modal fade" id="modalCrearProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <form method="POST" action="{% url 'crear_producto' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-box-seam me-2 text-coffee"></i>Registrar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body px-4 pt-3 pb-4">
                    <p class="text-muted small mb-3">Los campos marcados con <span class="text-danger fw-bold">*</span> son obligatorios.</p>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Producto <span class="text-danger fw-bold">*</span></label>
                        <input type="text" name="nombre" class="form-control rounded-3" placeholder="Ej. Coca-Cola 355ml" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Categoría <span class="text-danger fw-bold">*</span></label>
                        <select name="categoria" class="form-select rounded-3" required>
                            <option value="">Seleccione una categoría</option>
                            {% for categoria in categorias %}
                            <option value="{{ categoria.categoria_id }}">{{ categoria.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row g-2">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Precio Compra ($) <span class="text-danger fw-bold">*</span></label>
                            <input type="number" step="0.01" name="precio_compra" class="form-control rounded-3" placeholder="0.00" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Precio Venta ($) <span class="text-danger fw-bold">*</span></label>
                            <input type="number" step="0.01" name="precio_venta" class="form-control rounded-3" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Cantidad Inicial (Stock) <span class="text-danger fw-bold">*</span></label>
                        <input type="number" name="cantidad" class="form-control rounded-3" min="0" placeholder="0" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-semibold">Fotografía / Imagen</label>
                        <input type="file" name="imagen_upload" class="form-control rounded-3" accept="image/*">
                        <small class="text-muted">Formatos recomendados: JPG, PNG, WEBP.</small>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-coffee rounded-pill px-4 shadow-sm">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>
</div>
