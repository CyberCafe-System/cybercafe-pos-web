{% extends 'base.html' %}
{% load static %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Inventario de Productos</h3>
    <!-- Se eliminó el botón de categorías -->
    <button class="btn btn-coffee" data-bs-toggle="modal" data-bs-target="#modalCrearProducto">
        <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
    </button>
</div>

<div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Imagen</th>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Precio Compra</th>
                        <th>Precio Venta</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Fila de ejemplo para la presentación -->
                    <tr>
                        <td>
                            <!-- Imagen de muestra (Puedes poner una URL de internet o de tu static) -->
                            <img src="https://via.placeholder.com/50" class="rounded shadow-sm" alt="Producto" style="width: 50px; height: 50px; object-fit: cover;">
                        </td>
                        <td class="fw-bold">#101</td>
                        <td class="fw-semibold">Doritos Nacho</td>
                        <td>Snacks</td>
                        <td><span class="badge bg-success">45</span></td>
                        <td>$0.50</td>
                        <td class="fw-bold text-success">$0.85</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal" data-bs-target="#modalEditarProducto"><i class="bi bi-pencil-square"></i></button>
                            <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#modalEliminarProducto"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

{% include 'inventario/crear.html' %}
{% include 'inventario/modificar.html' %}
{% endblock %}
