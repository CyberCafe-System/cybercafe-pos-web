<!-- Modal Modificar Equipo -->
<div class="modal fade" id="modalModificarEquipo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{% url 'modificar_equipo' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Modificar Equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="equipo_id" value="{{ equipo.equipo_id }}">
                    <div class="mb-3">
                        <label class="form-label">Nombre/Identificador</label>
                        <input type="text" name="nombre" class="form-control" value="{{ equipo.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tarifa por Hora</label>
                        <input type="number" step="0.01" name="tarifa_por_hora" class="form-control" value="{{ equipo.tarifa_por_hora }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estado Físico</label>
                        <select name="estado" class="form-select">
                            <option value="DISPONIBLE">Disponible</option>
                            <option value="EN_MANTENIMIENTO">En Mantenimiento</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Actualizar</button>
                </div>
            </form>
        </div>
    </div>
</div>
